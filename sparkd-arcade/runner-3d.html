<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b19}canvas{display:block;width:100%;height:100%}#fallback{position:absolute;inset:0;display:grid;place-items:center;color:#baffd0;font:16px system-ui}</style></head><body><div id="fallback">Loading 3D runner…</div><script type="module">
try{
const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/+esm');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x80b6db);scene.fog=new THREE.Fog(0x80b6db,25,85);
const camera=new THREE.PerspectiveCamera(48,2,.1,100);camera.position.set(3,3.6,11);camera.lookAt(0,1,-7);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xa6ffd0,0x142d1e,2);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffe4a2,2);sun.position.set(-4,9,7);sun.castShadow=true;scene.add(sun);
const material=(color,glow=0)=>new THREE.MeshStandardMaterial({color,emissive:glow,roughness:.7});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(18,100),material(0x59666b));floor.rotation.x=-Math.PI/2;floor.position.z=-15;floor.receiveShadow=true;scene.add(floor);
const lines=[];for(let i=0;i<18;i++){const line=new THREE.Mesh(new THREE.BoxGeometry(.08,.03,1.3),material(0xf2d874));line.position.set(-1.8,.035,7-i*3);scene.add(line);lines.push(line)}
const buildings=[];for(let i=0;i<28;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(1.3+(i%3)*.5,3+(i%5)*1.2,2),material(i%2?0x98b3bf:0xd3c3a2));b.position.set(i%2?-5:5,1.5+(i%5)*.6,8-Math.floor(i/2)*3.8);scene.add(b);buildings.push(b);for(let j=0;j<3;j++){const windowStrip=new THREE.Mesh(new THREE.BoxGeometry(.12,.14,.025),material(0xf8e5a0,0x65542c));windowStrip.position.set((j-1)*.33,.3+(j%2)*.5,1.015);b.add(windowStrip)}}
function block(parent,w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
const hero=new THREE.Group();scene.add(hero);const referenceTexture=new THREE.TextureLoader().load('../sparkd-man-ai/sparkd-removebg-preview.png',()=>{referenceHero.visible=true;hero.visible=false},undefined,()=>{referenceHero.visible=false;hero.visible=true});referenceTexture.colorSpace=THREE.SRGBColorSpace;const referenceHero=new THREE.Sprite(new THREE.SpriteMaterial({map:referenceTexture,transparent:true,depthWrite:false}));referenceHero.scale.set(2.2,3.3,1);referenceHero.position.set(0,1.65,.15);referenceHero.visible=false;scene.add(referenceHero);const heroShadow=new THREE.Mesh(new THREE.CircleGeometry(.7,24),new THREE.MeshBasicMaterial({color:0x020d08,transparent:true,opacity:.38,depthWrite:false}));heroShadow.rotation.x=-Math.PI/2;heroShadow.position.set(0,.055,0);scene.add(heroShadow);block(hero,.8,1,.5,0x121b18,0,1.15,0);block(hero,.88,.2,.55,0x22e77d,0,1.4,.05);block(hero,.67,.48,.48,0xe4b588,0,1.95,0);block(hero,.75,.17,.55,0xf2c548,0,2.24,0);block(hero,.76,.15,.57,0x15c56b,0,2,.04);const cape=block(hero,.95,1.15,.07,0x087d3d,0,1.3,-.34);const leftLeg=new THREE.Group(),rightLeg=new THREE.Group(),leftArm=new THREE.Group(),rightArm=new THREE.Group();for(const [g,x,y] of [[leftLeg,-.23,.8],[rightLeg,.23,.8],[leftArm,-.55,1.55],[rightArm,.55,1.55]]){g.position.set(x,y,0);hero.add(g)}block(leftLeg,.24,.75,.3,0x171d1b,0,-.38,0);block(rightLeg,.24,.75,.3,0x171d1b,0,-.38,0);block(leftArm,.23,.75,.28,0x25bd65,0,-.35,0);block(rightArm,.23,.75,.28,0x25bd65,0,-.35,0);const badge=block(hero,.22,.25,.05,0xf7cb4c,0,1.2,.28);badge.rotation.z=.2;const eyeL=block(hero,.14,.06,.045,0xffe4a2,-.18,2.03,.33),eyeR=block(hero,.14,.06,.045,0xffe4a2,.18,2.03,.33);const trim=block(hero,1.02,.06,.08,0xf4c64c,0,.69,-.4);trim.rotation.x=-.15;
const hazardMat=material(0xe0a537),droneMat=material(0xc94459),orbMat=material(0x71ffad,0x267a44);const objects=new Map();
let snapshot=null,clock=0,last=performance.now(),stopped=false,heroY=0,heroPitch=0;
function makeItem(item){let mesh;if(item.type==='orb'){mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(.27,1),orbMat)}else if(item.type==='drone'){mesh=new THREE.Mesh(new THREE.BoxGeometry(.9,.5,.65),droneMat)}else{mesh=new THREE.Mesh(new THREE.BoxGeometry(.6,.85,.65),hazardMat)}mesh.castShadow=true;scene.add(mesh);return mesh}
function updateObjects(items){const seen=new Set();for(let i=0;i<items.length;i++){const it=items[i],id=it.id;seen.add(id);let mesh=objects.get(id);if(!mesh){mesh=makeItem(it);objects.set(id,mesh)}mesh.position.set(0,it.type==='orb'?Math.max(.7,(345-(it.y+12))/52):it.type==='drone'?1.4:.42,-(it.x-105)/65);if(it.type==='orb'){mesh.rotation.y=clock*3;mesh.position.y+=Math.sin(clock*5+id)*.09}}for(const [id,mesh] of objects){if(!seen.has(id)){scene.remove(mesh);objects.delete(id)}}}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||!e.data)return;if(e.data.type==='sparkd-runner-reset'){for(const mesh of objects.values())scene.remove(mesh);objects.clear();snapshot=null;heroY=0;heroPitch=0;clock=0;return}if(e.data.type!=='sparkd-runner-frame')return;snapshot=e.data;stopped=!!snapshot.stopped;updateObjects(snapshot.items||[])});
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();renderer.setSize(w,h,false)}addEventListener('resize',resize);resize();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(!stopped)clock+=dt;if(snapshot){const targetY=Math.max(0,(345-snapshot.y-(snapshot.duck?43:70))/52);heroY=THREE.MathUtils.damp(heroY,targetY,18,dt);hero.position.set(0,heroY,0);referenceHero.position.y=1.65+heroY;hero.scale.y=THREE.MathUtils.damp(hero.scale.y,snapshot.duck?.7:1,16,dt);referenceHero.scale.y=THREE.MathUtils.damp(referenceHero.scale.y,snapshot.duck?1.65:3.3,18,dt);referenceHero.position.y=(snapshot.duck?.85:1.65)+heroY;heroPitch=THREE.MathUtils.damp(heroPitch,snapshot.duck?.22:targetY>.15?-.12:0,9,dt);hero.rotation.x=heroPitch;heroShadow.material.opacity=.38/(1+heroY*.7);heroShadow.scale.setScalar(1+heroY*.2);const blink=snapshot.invulnerable<=0||Math.floor(clock*12)%2===0;hero.visible=!referenceHero.material.map?.image?.complete&&blink;referenceHero.visible=!!referenceTexture.image&&blink;const stride=Math.sin(clock*13)*(snapshot.duck?.18:targetY>.15?.08:.65);leftLeg.rotation.x=stride;rightLeg.rotation.x=-stride;leftArm.rotation.x=-stride*.7;rightArm.rotation.x=stride*.7;cape.rotation.x=-.15+Math.sin(clock*9)*.1+(targetY>.15?.2:0);for(const line of lines){line.position.z+=(stopped?0:dt)*(snapshot.speed||280)/65;if(line.position.z>9)line.position.z-=54}for(const b of buildings){b.position.z+=(stopped?0:dt)*(snapshot.speed||280)/85;if(b.position.z>12)b.position.z-=54}}renderer.render(scene,camera)}
document.getElementById('fallback').remove();parent.postMessage({type:'sparkd-runner-3d-ready'},location.origin);requestAnimationFrame(frame);
}catch(err){document.getElementById('fallback').textContent='3D unavailable; switching to classic renderer.';parent.postMessage({type:'sparkd-runner-3d-error'},location.origin)}
</script></body></html>
