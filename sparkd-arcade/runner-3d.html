function makeItem(item){const group=new THREE.Group();let mesh;if(item.type==='orb'){mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(.3,1),orbMat)}else if(item.type==='drone'){mesh=new THREE.Mesh(new THREE.BoxGeometry(.92,.52,.8),droneMat);const eye=new THREE.Mesh(new THREE.BoxGeometry(.55,.12,.08),material(0xfff0a4,0x774422));eye.position.set(0,0,.44);mesh.add(eye)}else{mesh=new THREE.Mesh(new THREE.BoxGeometry(.7,.78,.7),hazardMat);for(const x of [-.36,.36]){const stripe=new THREE.Mesh(new THREE.BoxGeometry(.14,.88,.73),material(0x2b2c31));stripe.position.x=x;mesh.add(stripe)}}group.add(mesh);if(item.type!=='orb'){const warning=new THREE.Mesh(new THREE.RingGeometry(.72,.93,24),warningMat.clone());warning.rotation.x=-Math.PI/2;warning.position.y=item.type==='drone'?-1.42:-.38;group.add(warning);group.userData.warning=warning}scene.add(group);return group}
