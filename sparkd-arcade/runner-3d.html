<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b19}canvas{display:block;width:100%;height:100%}#fallback{position:absolute;inset:0;display:grid;place-items:center;color:#baffd0;font:16px system-ui}</style></head><body><div id="fallback">Loading 3D runner…</div><script type="module">
try{
const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/+esm');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1b1c);scene.fog=new THREE.Fog(0x0b1b1c,12,45);
const camera=new THREE.PerspectiveCamera(48,2,.1,100);camera.position.set(3.5,4.1,12);camera.lookAt(0,1,-5);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xa6ffd0,0x142d1e,2);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffe4a2,2);sun.position.set(-4,9,7);sun.castShadow=true;scene.add(sun);
const material=(color,glow=0)=>new THREE.MeshStandardMaterial({color,emissive:glow,roughness:.7});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(18,100),material(0x173b2a));floor.rotation.x=-Math.PI/2;floor.position.z=-15;floor.receiveShadow=true;scene.add(floor);
const lines=[];for(let i=0;i<18;i++){const line=new THREE.Mesh(new THREE.BoxGeometry(.08,.03,1.3),material(0x66b77c));line.position.set(-1.8,.035,7-i*3);scene.add(line);lines.push(line)}
const buildings=[];for(let i=0;i<28;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(1.3+(i%3)*.5,3+(i%5)*1.2,2),material(i%2?0x14392f:0x20463b));b.position.set(i%2?-5:5,1.5+(i%5)*.6,8-Math.floor(i/2)*3.8);scene.add(b);buildings.push(b)}
function block(parent,w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
const hero=new THREE.Group();scene.add(hero);block(hero,.8,1,.5,0x121b18,0,1.15,0);block(hero,.88,.2,.55,0x22e77d,0,1.4,.05);block(hero,.67,.48,.48,0xe4b588,0,1.95,0);block(hero,.75,.17,.55,0xf2c548,0,2.24,0);block(hero,.76,.15,.57,0x15c56b,0,2,.04);block(hero,.22,.78,.28,0xe4b43e,-.23,.38,0);block(hero,.22,.78,.28,0xe4b43e,.23,.38,0);const cape=block(hero,.95,1.15,.07,0x087d3d,0,1.3,-.34);
const hazardMat=material(0xe0a537),droneMat=material(0xc94459),orbMat=material(0x71ffad,0x267a44);const objects=new Map();
let snapshot=null,clock=0,last=performance.now(),stopped=false;
function makeItem(item){let mesh;if(item.type==='orb'){mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(.27,1),orbMat)}else if(item.type==='drone'){mesh=new THREE.Mesh(new THREE.BoxGeometry(.9,.5,.65),droneMat)}else{mesh=new THREE.Mesh(new THREE.BoxGeometry(.6,.85,.65),hazardMat)}mesh.castShadow=true;scene.add(mesh);return mesh}
function updateObjects(items){const seen=new Set();for(let i=0;i<items.length;i++){const it=items[i],id=it.id;seen.add(id);let mesh=objects.get(id);if(!mesh){mesh=makeItem(it);objects.set(id,mesh)}mesh.position.set(0,it.type==='orb'?1.65:it.type==='drone'?1.4:.42,-(it.x-105)/65);if(it.type==='orb')mesh.rotation.y=clock*3}for(const [id,mesh] of objects){if(!seen.has(id)){scene.remove(mesh);objects.delete(id)}}}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||!e.data||e.data.type!=='sparkd-runner-frame')return;snapshot=e.data;stopped=!!snapshot.stopped;updateObjects(snapshot.items||[])});
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();renderer.setSize(w,h,false)}addEventListener('resize',resize);resize();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(!stopped)clock+=dt;if(snapshot){hero.position.set(0,Math.max(0,(345-snapshot.y-(snapshot.duck?43:70))/52),0);hero.scale.y=snapshot.duck?.72:1;hero.visible=snapshot.invulnerable<=0||Math.floor(clock*12)%2===0;cape.rotation.x=-.15+Math.sin(clock*9)*.1;for(const line of lines){line.position.z+=dt*(snapshot.speed||280)/65;if(line.position.z>9)line.position.z-=54}for(const b of buildings){b.position.z+=dt*(snapshot.speed||280)/85;if(b.position.z>12)b.position.z-=54}}renderer.render(scene,camera)}
document.getElementById('fallback').remove();parent.postMessage({type:'sparkd-runner-3d-ready'},location.origin);requestAnimationFrame(frame);
}catch(err){document.getElementById('fallback').textContent='3D unavailable; switching to classic renderer.';parent.postMessage({type:'sparkd-runner-3d-error'},location.origin)}
</script></body></html>
