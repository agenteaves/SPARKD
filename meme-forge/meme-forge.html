<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SPARKD Meme Forge</title>

<meta name="description"
content="The ultimate meme generator for the SPARKD community.">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Roboto:wght@300;400;500;700&family=Bangers&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

</head>

<body>

<div id="backgroundGlow"></div>

<div id="particleLayer"></div>

<div id="app">

<header id="topBar">

<div class="logoArea">

<div class="logoIcon">
🔥
</div>

<div>

<h1>

SPARKD
<span>MEME FORGE</span>

</h1>

<p>

Create.
Laugh.
Share.
Moon.

</p>

</div>

</div>

<div class="toolbar">

<button id="undoBtn">
↶ Undo
</button>

<button id="redoBtn">
↷ Redo
</button>

<button id="saveProjectBtn">
💾 Save
</button>

<button id="loadProjectBtn">
📂 Load
</button>

<button id="randomBtn">
🎲 SPARK IT!
</button>

<button id="downloadBtn">
⬇ Download
</button>

<button id="shareBtn">
🚀 Share
</button>

<button id="fullscreenBtn">
⛶ Fullscreen
</button>

</div>

</header>

<div id="workspace">

<!-- ====================================== -->
<!-- LEFT SIDEBAR -->
<!-- ====================================== -->

<aside id="leftSidebar">

<div class="panelTitle">

TOOLS

</div>

<button class="toolButton"
id="uploadImageButton">

🖼 Upload Image

</button>

<input
type="file"
id="imageUpload"
accept="image/*"
hidden>

<button class="toolButton">

😂 Meme Templates

</button>

<button class="toolButton">

⭐ Stickers

</button>

<button class="toolButton">

😀 Emoji

</button>

<button class="toolButton">

🔤 Text

</button>

<button class="toolButton">

📐 Shapes

</button>

<button class="toolButton">

🌈 Background

</button>

<button class="toolButton">

⚡ Effects

</button>

<button class="toolButton">

🤖 AI Caption

</button>

<hr>

<div class="panelTitle">

TEXT

</div>

<label>

Top Text

</label>

<input
type="text"
id="topText"
placeholder="Enter top text">

<label>

Bottom Text

</label>

<input
type="text"
id="bottomText"
placeholder="Enter bottom text">

<label>

Font

</label>

<select id="fontFamily">

<option>Bangers</option>

<option>Impact</option>

<option>Orbitron</option>

<option>Roboto</option>

</select>

<label>

Font Size

</label>

<input
type="range"
id="fontSize"
min="20"
max="140"
value="60">

<label>

Text Color

</label>

<input
type="color"
id="fontColor"
value="#ffffff">

<button
class="primaryButton"
id="addTextButton">

➕ Add Text Layer

</button>

<hr>

<div class="panelTitle">

CANVAS

</div>

<label>

Zoom

</label>

<input
type="range"
id="zoomSlider"
min="25"
max="300"
value="100">

<label>

Canvas Size

</label>

<select id="canvasSize">

<option value="1080">

1080 x 1080

</option>

<option value="1920">

1920 x 1080

</option>

<option value="1350">

1350 x 1080

</option>

<option value="1080x1920">

1080 x 1920

</option>

</select>

<button
class="dangerButton"
id="clearCanvas">

🗑 Clear Canvas

</button>

</aside>

<!-- ====================================== -->
<!-- CENTER STARTS HERE -->
<!-- ====================================== -->

<section id="centerArea">

<div id="canvasToolbar">

<button>📏 Grid</button>

<button>🧲 Snap</button>

<button>🎯 Center Guides</button>

<button>🔲 Safe Zone</button>

<button>📦 Layers</button>

<button>👁 Preview</button>

</div>

<div id="canvasWrapper">

<canvas
id="memeCanvas"
width="1080"
height="1080">
</canvas>

</div>
