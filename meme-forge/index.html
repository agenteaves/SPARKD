<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPARKD Meme Forge</title>

<meta name="description" content="Create, customize and share SPARKD community memes.">


<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Bangers&display=swap" rel="stylesheet">


<link rel="stylesheet" href="style.css">


<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>


</head>


<body>


<div id="app">


<header>

<h1>
🔥 SPARKD
<span>MEME FORGE</span>
</h1>


<p>Create • Customize • Share • SPARK</p>


</header>




<!-- TOP TEXT TOOL -->
<div id="textToolbar">

    <input 
    id="textInput"
    placeholder="SPARKD TO THE MOON">

    <button id="addTextBtn">
    🔤 Add Text
    </button>

</div>



<!-- LEFT SIDE TOOLBAR -->
<div id="sideToolbar">

    <button id="uploadBtn">
    🖼 Upload Image
    </button>


    <input 
    type="file"
    id="imageInput"
    accept="image/*"
    hidden>


    <button id="deleteBtn">
    🗑 Delete
    </button>


<div class="emojiContainer">

    <button id="emojiBtn">
        😀 Emojis
    </button>

    <div id="emojiPicker">

        <span class="emojiOption">😀</span>
        <span class="emojiOption">😂</span>
        <span class="emojiOption">🤣</span>
        <span class="emojiOption">😎</span>

        <span class="emojiOption">😍</span>
        <span class="emojiOption">🔥</span>
        <span class="emojiOption">🚀</span>
        <span class="emojiOption">💎</span>

        <span class="emojiOption">❤️</span>
        <span class="emojiOption">⚡</span>
        <span class="emojiOption">🐸</span>
        <span class="emojiOption">👑</span>

        <span class="emojiOption">💰</span>
        <span class="emojiOption">🤑</span>
        <span class="emojiOption">💯</span>
        <span class="emojiOption">👍</span>

    </div>

</div>


<div id="editor">


<div id="canvasBox">


<canvas
id="memeCanvas"
width="1080"
height="1080">
</canvas>


    </div>

</div>



<label>
Contract Watermark:
</label>


<label>
SPARKD Token:
</label>

<p>
Official Solana Contract Automatically Applied
</p>







</div>







<footer>

SPARKD MEME FORGE v1.1

</footer>




</div>





<script src="app.js?v=10"></script>


</body>

</html>
