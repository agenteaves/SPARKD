name: SPARKD Arcade Anti-Cheat Checks
on:
  push:
    paths:
      - 'sparkd-arcade/anti-cheat/**'
      - 'sparkd-arcade/controls/game.js'
      - 'sparkd-arcade/index.html'
      - '.github/workflows/sparkd-arcade-anticheat.yml'
  pull_request:
    paths:
      - 'sparkd-arcade/anti-cheat/**'
      - 'sparkd-arcade/controls/game.js'
      - 'sparkd-arcade/index.html'
      - '.github/workflows/sparkd-arcade-anticheat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser game JavaScript syntax
        run: node --check sparkd-arcade/controls/game.js
      - name: Run offline deterministic replay and anti-cheat tests
        run: node --test sparkd-arcade/anti-cheat/*.test.mjs
