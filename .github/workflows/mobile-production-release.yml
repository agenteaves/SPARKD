name: SPARKD Signed Production APK

on:
  push:
    branches:
      - mobile-app-development
    paths:
      - 'mobile-app/**'
      - '.well-known/assetlinks.json'
      - '.github/workflows/mobile-production-release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        type: string
      publish_release:
        description: 'Publish this APK as a public GitHub release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-app-development
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SPARKD_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/SPARKD-release.jks"
          test -s "$RUNNER_TEMP/SPARKD-release.jks"
      - name: Build signed APK
        env:
          STORE_PASSWORD: ${{ secrets.SPARKD_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPARKD_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPARKD_RELEASE_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease \
            -PSPARKD_RELEASE_STORE_FILE="$RUNNER_TEMP/SPARKD-release.jks" \
            -PSPARKD_RELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PSPARKD_RELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PSPARKD_RELEASE_KEY_PASSWORD="$KEY_PASSWORD"
      - name: Verify production signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Prepare signed APK
        run: cp app/build/outputs/apk/release/app-release.apk SPARKD-Mobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sparkd-mobile-signed-apk
          path: mobile-app/SPARKD-Mobile.apk
      - name: Publish live Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-production --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create android-production \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SPARKD Android" \
              --notes "Current production-signed SPARKD Android app."
          fi
          gh release upload android-production SPARKD-Mobile.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
      - name: Publish update manifest after APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_CODE=$(grep -o 'versionCode=[0-9]*' app/build.gradle.kts | head -1 | cut -d= -f2)
          VERSION_NAME=$(grep -o 'versionName="[^"]*"' app/build.gradle.kts | head -1 | cut -d\" -f2)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          TMPDIR=$(mktemp -d)
          git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TMPDIR/repo"
          cat > "$TMPDIR/repo/app-version.json" <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "downloadUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/android-production/SPARKD-Mobile.apk"
          }
          EOF
          cd "$TMPDIR/repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-version.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Android update manifest ${VERSION_NAME}"
            git push origin main
          fi
