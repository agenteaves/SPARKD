name: SPARKD Mobile Preview Build

on:
  push:
    branches:
      - mobile-app-development
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-preview-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-app-development
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify preview source
        run: |
          echo "BUILD_SHA=$(git rev-parse HEAD)"
          grep 'versionCode=2' app/build.gradle.kts
          grep '@drawable/sparkd_exact_loops' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/sparkd_exact_loops.png
          sha256sum app/src/main/res/drawable/sparkd_exact_loops.png
      - run: gradle :app:assembleDebug
      - name: Inspect built APK launcher resources
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'sparkd_exact_loops|ic_launcher' || true
          unzip -p app/build/outputs/apk/debug/app-debug.apk res/drawable/sparkd_exact_loops.png > /tmp/packed-icon.png
          test -s /tmp/packed-icon.png
          echo "SOURCE_ICON:"
          sha256sum app/src/main/res/drawable/sparkd_exact_loops.png
          echo "PACKED_ICON:"
          sha256sum /tmp/packed-icon.png
          cmp app/src/main/res/drawable/sparkd_exact_loops.png /tmp/packed-icon.png
      - name: Prepare preview APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SPARKD-Mobile-Preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sparkd-mobile-preview-apk
          path: mobile-app/SPARKD-Mobile-Preview.apk
      - name: Publish permanent mobile preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mobile-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create mobile-preview --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SPARKD Mobile Preview" --notes "Disconnected Android preview build for testing. Production contest actions remain disabled." --prerelease
          gh release upload mobile-preview SPARKD-Mobile-Preview.apk --repo "$GITHUB_REPOSITORY" --clobber
