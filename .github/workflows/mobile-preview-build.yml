name: SPARKD Mobile Preview Build

on:
  push:
    branches:
      - mobile-app-development
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-preview-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :app:assembleDebug
      - name: Prepare preview APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SPARKD-Mobile-Preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sparkd-mobile-preview-apk
          path: mobile-app/SPARKD-Mobile-Preview.apk
      - name: Publish permanent mobile preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mobile-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create mobile-preview --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SPARKD Mobile Preview" --notes "Disconnected Android preview build for testing. Production contest actions remain disabled." --prerelease
          gh release upload mobile-preview SPARKD-Mobile-Preview.apk --repo "$GITHUB_REPOSITORY" --clobber
