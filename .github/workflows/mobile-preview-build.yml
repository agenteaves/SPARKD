name: SPARKD Mobile Integration Build

on:
  push:
    branches:
      - mobile-app-development
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-preview-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-app-development
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify mobile source
        run: |
          echo "BUILD_SHA=$(git rev-parse HEAD)"
          grep 'versionCode=3' app/build.gradle.kts
          grep '@mipmap/ic_launcher' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/sparkd_exact_loops.png
      - run: gradle :app:assembleDebug
      - name: Inspect built APK launcher resources
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'ic_launcher'
          test "$(unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -c 'ic_launcher')" -ge 1
      - name: Prepare integration APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SPARKD-Mobile-Integration.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sparkd-mobile-integration-apk
          path: mobile-app/SPARKD-Mobile-Integration.apk
