name: SPARKD Mobile Preview Build
on:
  push:
    branches: [ mobile-app-development ]
    paths: [ 'mobile-app/**', '.github/workflows/mobile-preview-build.yml' ]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: sparkd-mobile-preview-apk, path: mobile-app/app/build/outputs/apk/debug/app-debug.apk }
