name: SPARKD Mobile Preview Build

on:
  push:
    branches:
      - mobile-app-development
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-preview-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-app-development
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify preview source
        run: |
          echo "BUILD_SHA=$(git rev-parse HEAD)"
          grep 'versionCode=2' app/build.gradle.kts
          grep '@mipmap/ic_launcher' app/src/main/AndroidManifest.xml
          test -s ../.github/workflows/144f9ff06447caca416f47fd69ee376c_1.jpg
      - name: Build launcher assets from uploaded SPARKD artwork
        run: |
          rm -f app/src/main/res/mipmap-anydpi/144f9ff06447caca416f47fd69ee376c_1.jpg
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open("../.github/workflows/144f9ff06447caca416f47fd69ee376c_1.jpg").convert("RGB")
          # Exact emblem region from the uploaded SPARKD coin artwork.
          w,h=src.size
          crop=src.crop((int(w*.345),int(h*.155),int(w*.655),int(h*.585)))
          sizes={"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for d,s in sizes.items():
              out=Path(f"app/src/main/res/mipmap-{d}")
              out.mkdir(parents=True,exist_ok=True)
              canvas=Image.new("RGB",(s,s),(0,0,0))
              im=crop.copy()
              im.thumbnail((int(s*.82),int(s*.82)),Image.Resampling.LANCZOS)
              canvas.paste(im,((s-im.width)//2,(s-im.height)//2))
              canvas.save(out/"ic_launcher.png","PNG")
          PY
      - run: gradle :app:assembleDebug
      - name: Inspect built APK launcher resources
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'ic_launcher'
          test "$(unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -c 'ic_launcher')" -ge 1
      - name: Prepare preview APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SPARKD-Mobile-Preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sparkd-mobile-preview-apk
          path: mobile-app/SPARKD-Mobile-Preview.apk
      - name: Publish permanent mobile preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mobile-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create mobile-preview --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SPARKD Mobile Preview" --notes "Disconnected Android preview build for testing. Production contest actions remain disabled." --prerelease
          gh release upload mobile-preview SPARKD-Mobile-Preview.apk --repo "$GITHUB_REPOSITORY" --clobber
