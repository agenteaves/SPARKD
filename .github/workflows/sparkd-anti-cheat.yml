name: SPARKD anti-cheat prototype tests
on:
  push:
    paths:
      - 'sparkd-arcade/anti-cheat/**'
      - '.github/workflows/sparkd-anti-cheat.yml'
  pull_request:
    paths:
      - 'sparkd-arcade/anti-cheat/**'
      - '.github/workflows/sparkd-anti-cheat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated anti-cheat unit tests
        run: node --test sparkd-arcade/anti-cheat/*.test.mjs
