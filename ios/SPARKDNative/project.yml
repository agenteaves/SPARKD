name: SPARKDNative
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.sparkdcoin.native
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  SPARKDNative:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SPARKD
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Select a photo to create a SPARKD meme.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save your SPARKD meme to Photos.
        SUPPORTS_MACCATALYST: NO
