<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SPARKD Contest Moderation</title>
  <style>
    body{font-family:Arial,sans-serif;background:#0b0b0d;color:#fff;margin:0;padding:24px}
    .wrap{max-width:1100px;margin:0 auto}
    h1{margin:0 0 8px}.sub{opacity:.7;margin-bottom:20px}
    .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
    input,button,textarea,select{padding:11px 13px;border-radius:10px;border:1px solid #333;background:#151519;color:#fff}
    input{flex:1;min-width:280px}button{cursor:pointer}.hidden{display:none}
    .status{margin:12px 0 18px;min-height:22px}.queue{display:grid;gap:16px}
    .item{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:16px;background:#151519;border:1px solid #2b2b32;border-radius:14px;padding:14px}
    .item img{width:100%;max-height:260px;object-fit:contain;background:#09090b;border-radius:10px}
    .meta{display:grid;gap:7px}.title{font-size:1.15rem;font-weight:700}.small{font-size:.86rem;opacity:.72;word-break:break-all}
    .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#25252b;font-size:.78rem;margin-right:6px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.approve{border-color:#2c6}.reject{border-color:#d55}.reason{width:100%;min-height:70px;box-sizing:border-box}
    .empty{padding:20px;background:#151519;border:1px solid #2b2b32;border-radius:14px;opacity:.75}
    @media(max-width:700px){.item{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>SPARKD Meme of the Week — Moderation</h1>
  <div class="sub">Protected review queue for current contest submissions. Decisions are final for pending entries.</div>
  <div class="bar">
    <input id="adminKey" type="password" autocomplete="off" placeholder="Enter admin access key">
    <button id="loadBtn">Load Submissions</button>
  </div>
  <div id="status" class="status"></div>
  <div id="queue" class="queue"></div>
</div>
<script src="admin-moderation.js"></script>
</body>
</html>
